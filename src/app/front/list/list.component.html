<div class="diva">
  <div class="divb">
    <label>問卷調查:<input (keyup)="changeData($event)" [(ngModel)]="inputData"></label>
    <br>
    <label>統計時間:</label><input type="date" [(ngModel)]="chooseDate"><label>到</label><input type="date" [(ngModel)]="endDate" min={{chooseDate}}><button class="btnStyle">搜尋</button>
  </div>
</div>
<div class="divStyle4">
<div style="width: 65%; " class="mat-elevation-z8">
<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      @if(admincreate){
      <mat-checkbox (change)="$event ? toggleAllRows() : null"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()">
      </mat-checkbox>
    }
    </th>
    <td mat-cell *matCellDef="let row">
       @if(admincreate){
      <mat-checkbox (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)">
      </mat-checkbox>
    }
    </td>
  </ng-container>

    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> 編號 <button class="btnStyle" (click)="powerDown()"><mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="sync_alt"></mat-icon></button></th>
      <td mat-cell *matCellDef="let element"> {{element.position}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> 名稱 </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="height">
      <th mat-header-cell *matHeaderCellDef> 狀態 </th>
      <td mat-cell *matCellDef="let element"> {{element.height}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef> 開始時間</th>
      <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef> 結束時間 </th>
      <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
</div>
<button routerLink="/front">按我</button>
<button (click)="adminlogin()">管理者登入</button>

@if(admincreate){
  <button routerLink="/backstage">新增表單</button>
}
